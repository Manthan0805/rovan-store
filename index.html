<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROVAN | Made for Your Own Way</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const products = [
      { id: 1, name: "The Linen Overshirt", color: "Sand", category: "Shirts", price: 3490, salePrice: 2790, image: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=900&q=85", badge: "SALE" },
      { id: 2, name: "Relaxed Studio Shirt", color: "Chalk", category: "Shirts", price: 3290, salePrice: null, image: "https://images.unsplash.com/photo-1598554747436-c9293d6a588f?auto=format&fit=crop&w=900&q=85", badge: "" },
      { id: 3, name: "The Edit: Three Shirts", color: "Natural", category: "Shirts", price: 4490, salePrice: 3690, image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=900&q=85", badge: "SALE" },
      { id: 4, name: "Soft Knit Pullover", color: "Oatmeal", category: "Knitwear", price: 3990, salePrice: null, image: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=900&q=85", badge: "NEW" },
      { id: 5, name: "Everyday Knit", color: "Warm Beige", category: "Knitwear", price: 3690, salePrice: 2990, image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=900&q=85", badge: "SALE" },
      { id: 6, name: "Classic Tailored Coat", color: "Camel", category: "Outerwear", price: 6490, salePrice: null, image: "https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=900&q=85", badge: "LIMITED" }
    ];

    const money = value => `₹${Number(value).toLocaleString("en-IN")}`;

    function SearchIcon() {
      return <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 5 5"/></svg>;
    }
    function UserIcon() {
      return <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4.5 21c0-4.2 3.3-7 7.5-7s7.5 2.8 7.5 7"/></svg>;
    }
    function BagIcon() {
      return <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>;
    }

    function Announcement() {
      return <div className="announcement">Complimentary shipping on orders over ₹3,999</div>;
    }

    function Navbar({ cartCount }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const closeMenu = () => setMenuOpen(false);

      return (
        <header className="navbar">
          <a href="#home" className="brand" onClick={closeMenu}>
            <div className="brand-name">ROVAN</div>
            <div className="brand-tagline">MADE FOR YOUR OWN WAY.</div>
          </a>

          <nav className={`nav-links ${menuOpen ? "open" : ""}`}>
            <a href="#home" onClick={closeMenu}>Home</a>
            <a href="#collection" onClick={closeMenu}>Collection</a>
            <a href="#sale" onClick={closeMenu}>Sale</a>
            <a href="#cart" onClick={closeMenu}>Cart ({cartCount})</a>
          </nav>

          <div className="nav-icons">
            <a href="#collection" className="icon-btn" aria-label="Browse products"><SearchIcon /></a>
            <button className="icon-btn account-icon" aria-label="Account" onClick={() => alert("Account feature coming soon.")}><UserIcon /></button>
            <a href="#cart" className="cart-icon-link" aria-label="Shopping cart">
              <BagIcon />
              {cartCount > 0 && <span className="bag-count">{cartCount}</span>}
            </a>
            <button className="icon-btn menu-toggle" onClick={() => setMenuOpen(!menuOpen)} aria-label="Toggle menu">
              {menuOpen ? "✕" : "☰"}
            </button>
          </div>
        </header>
      );
    }

    function Hero() {
      return (
        <main className="hero" id="home">
          <section className="hero-content">
            <div className="hero-label"><span>✧</span> THE SPRING EDIT</div>
            <h1>Clothes for a<br/>quieter kind<br/>of<br/>confidence.</h1>
            <p className="hero-description">Thoughtfully designed pieces for the way you want to feel. Discover timeless essentials made to move with you.</p>
            <div className="hero-actions">
              <a href="#collection" className="shop-btn">EXPLORE COLLECTION <span>↗</span></a>
              <a href="#story" className="discover-link">Discover our story</a>
            </div>
          </section>
          <section className="hero-image">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=90" alt="Fashion model in a neutral-toned spring look"/>
            <div className="image-caption">THE SPRING COLLECTION — 2026</div>
          </section>
        </main>
      );
    }

    function FeatureStrip() {
      return (
        <section className="feature-strip">
          <div className="feature"><span className="feature-icon">♧</span><div><h4>Free shipping over ₹3,999</h4><p>Easy returns within 30 days</p></div></div>
          <div className="feature"><span className="feature-icon">✧</span><div><h4>Natural, lasting materials</h4><p>Chosen for feel and durability</p></div></div>
          <div className="feature"><span className="feature-icon">♡</span><div><h4>Made with consideration</h4><p>Small runs, thoughtful details</p></div></div>
        </section>
      );
    }

    function ProductCard({ product, addToCart }) {
      const [liked, setLiked] = useState(false);
      const displayPrice = product.salePrice || product.price;

      return (
        <article className="product-card">
          <div className="product-image">
            <img src={product.image} alt={product.name} loading="lazy"/>
            {product.badge && <span className={`product-badge ${product.salePrice ? "sale-badge" : ""}`}>{product.badge}</span>}
            <button className={`wishlist ${liked ? "liked" : ""}`} onClick={() => setLiked(!liked)} aria-label="Add to wishlist">{liked ? "♥" : "♡"}</button>
          </div>
          <div className="product-info">
            <div className="product-title-row">
              <h3 className="product-name">{product.name}</h3>
              <div className="product-prices">
                {product.salePrice && <span className="old-price">{money(product.price)}</span>}
                <span className="product-price">{money(displayPrice)}</span>
              </div>
            </div>
            <p className="product-meta">{product.color} · {product.category}</p>
            <button className="add-cart-btn" onClick={() => addToCart(product)}>Add to cart +</button>
          </div>
        </article>
      );
    }

    function Collection({ addToCart }) {
      const [activeCategory, setActiveCategory] = useState("All pieces");
      const categories = ["All pieces", "Shirts", "Knitwear", "Outerwear"];
      const filteredProducts = activeCategory === "All pieces" ? products : products.filter(p => p.category === activeCategory);

      return (
        <section className="collection" id="collection">
          <div className="collection-top">
            <div><p className="section-eyebrow">SHOP THE EDIT</p><h2>Everyday, elevated.</h2></div>
            <div className="filters">
              {categories.map(category => <button key={category} className={`filter-btn ${activeCategory === category ? "active" : ""}`} onClick={() => setActiveCategory(category)}>{category}</button>)}
            </div>
          </div>
          <div className="product-grid">
            {filteredProducts.map(product => <ProductCard key={product.id} product={product} addToCart={addToCart}/>)}
          </div>
        </section>
      );
    }

    function SalePage({ addToCart }) {
      const saleProducts = products.filter(product => product.salePrice);
      return (
        <section className="collection sale-section" id="sale">
          <div className="collection-top">
            <div><p className="section-eyebrow">A LITTLE SOMETHING LESS</p><h2>The Sale Edit.</h2><p className="sale-description">Thoughtful pieces, now at special prices.</p></div>
            <span className="sale-note">Selected pieces · Limited time</span>
          </div>
          <div className="product-grid">
            {saleProducts.map(product => <ProductCard key={product.id} product={product} addToCart={addToCart}/>)}
          </div>
        </section>
      );
    }

    function CartPage({ cart, updateQuantity, removeFromCart }) {
      const subtotal = cart.reduce((sum, item) => sum + (item.salePrice || item.price) * item.quantity, 0);
      const shipping = subtotal === 0 || subtotal >= 3999 ? 0 : 99;

      return (
        <section className="cart-section" id="cart">
          <div className="cart-heading"><p className="section-eyebrow">YOUR SELECTION</p><h2>Your Shopping Bag</h2></div>
          {cart.length === 0 ? (
            <div className="empty-cart">
              <div className="empty-cart-icon">♡</div>
              <h3>Your bag is feeling a little light.</h3>
              <p>Discover pieces made for your own way.</p>
              <a href="#collection" className="shop-btn">EXPLORE COLLECTION ↗</a>
            </div>
          ) : (
            <div className="cart-layout">
              <div className="cart-items">
                {cart.map(item => (
                  <div className="cart-item" key={item.id}>
                    <img src={item.image} alt={item.name}/>
                    <div className="cart-item-info">
                      <h3>{item.name}</h3><p>{item.color} · {item.category}</p>
                      <div className="quantity-control">
                        <button onClick={() => updateQuantity(item.id, item.quantity - 1)} aria-label="Decrease quantity">−</button>
                        <span>{item.quantity}</span>
                        <button onClick={() => updateQuantity(item.id, item.quantity + 1)} aria-label="Increase quantity">+</button>
                      </div>
                      <button className="remove-item" onClick={() => removeFromCart(item.id)}>Remove</button>
                    </div>
                    <strong>{money((item.salePrice || item.price) * item.quantity)}</strong>
                  </div>
                ))}
              </div>
              <aside className="cart-summary">
                <h3>Order Summary</h3>
                <div className="summary-row"><span>Subtotal</span><span>{money(subtotal)}</span></div>
                <div className="summary-row"><span>Shipping</span><span>{shipping === 0 ? "FREE" : money(shipping)}</span></div>
                {subtotal > 0 && subtotal < 3999 && <p className="shipping-note">Add {money(3999 - subtotal)} more for free shipping.</p>}
                <div className="summary-row total-row"><span>Total</span><strong>{money(subtotal + shipping)}</strong></div>
                <button className="checkout-btn" onClick={() => alert("Checkout is a demo. Connect a payment gateway to accept orders.")}>PROCEED TO CHECKOUT →</button>
                <a href="#collection" className="continue-shopping">Continue shopping</a>
              </aside>
            </div>
          )}
        </section>
      );
    }

    function Newsletter() {
      const [email, setEmail] = useState("");
      const [message, setMessage] = useState("");

      function handleSubmit(event) {
        event.preventDefault();
        if (!email.trim()) return;
        setMessage("Thank you for joining the ROVAN list!");
        setEmail("");
      }

      return (
        <section className="newsletter-section" id="journal">
          <div className="newsletter-box">
            <p className="newsletter-eyebrow">NOTES FROM THE STUDIO</p>
            <h2>Thoughtful updates, never<br/>too many.</h2>
            <p className="newsletter-description">New collections, material stories, and practical ways to care for the clothes you keep.</p>
            <form className="newsletter-form" onSubmit={handleSubmit}>
              <input type="email" placeholder="Email address" aria-label="Email address" value={email} onChange={e => setEmail(e.target.value)} required/>
              <button type="submit">Join the list</button>
            </form>
            <p className="newsletter-message" aria-live="polite">{message}</p>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="site-footer" id="story">
          <div className="footer-main">
            <div className="footer-brand">
              <a href="#home" className="brand"><div className="brand-name">ROVAN</div><div className="brand-tagline">MADE FOR YOUR OWN WAY.</div></a>
              <p className="footer-brand-description">Thoughtfully designed essentials. Made to last, made to feel like you.</p>
              <div className="footer-socials">
                <a href="https://www.instagram.com/" target="_blank" rel="noreferrer" className="social-link">ig</a>
                <a href="https://www.pinterest.com/" target="_blank" rel="noreferrer" className="social-link">p</a>
                <a href="https://www.facebook.com/" target="_blank" rel="noreferrer" className="social-link">f</a>
              </div>
            </div>
            <div className="footer-column"><h4>Explore</h4><a href="#home">Home</a><a href="#collection">Collection</a><a href="#sale">Sale</a><a href="#cart">Shopping bag</a></div>
            <div className="footer-column"><h4>Help & Support</h4><a href="#footer">Shipping & returns</a><a href="#footer">Size guide</a><a href="#footer">Care instructions</a><a href="mailto:hello@rovan.example">Contact us</a><a href="#footer">FAQs</a></div>
            <div className="footer-column"><h4>Our World</h4><a href="#story">Our story</a><a href="#journal">Journal</a><a href="#journal">Materials & care</a><a href="#journal">Sustainability</a><a href="https://www.instagram.com/" target="_blank" rel="noreferrer">Instagram</a></div>
          </div>
          <div className="footer-bottom">
            <p>© 2026 ROVAN. All rights reserved.</p>
            <div className="footer-bottom-links"><a href="#footer">Privacy policy</a><a href="#footer">Terms of service</a><a href="#footer">Refund policy</a></div>
            <a href="#home" className="back-to-top">Back to top ↑</a>
          </div>
        </footer>
      );
    }

    function App() {
      const [cart, setCart] = useState([]);

      function addToCart(product) {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) return prev.map(item => item.id === product.id ? {...item, quantity: item.quantity + 1} : item);
          return [...prev, {...product, quantity: 1}];
        });
      }

      function updateQuantity(id, quantity) {
        if (quantity < 1) {
          setCart(prev => prev.filter(item => item.id !== id));
          return;
        }
        setCart(prev => prev.map(item => item.id === id ? {...item, quantity} : item));
      }

      function removeFromCart(id) {
        setCart(prev => prev.filter(item => item.id !== id));
      }

      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <>
          <Announcement/>
          <Navbar cartCount={cartCount}/>
          <Hero/>
          <FeatureStrip/>
          <Collection addToCart={addToCart}/>
          <SalePage addToCart={addToCart}/>
          <CartPage cart={cart} updateQuantity={updateQuantity} removeFromCart={removeFromCart}/>
          <Newsletter/>
          <Footer/>
          <button className="help-button" onClick={() => alert("Welcome to ROVAN! How can we help?")} aria-label="Help">?</button>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
